name: scorecard

# OpenSSF Scorecard: grades the repo's supply-chain practices (pinned
# dependencies, token permissions, branch protection, and so on) and reports
# results to the repository's Security tab.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload results to code scanning
      id-token: write # publish results to the public Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
